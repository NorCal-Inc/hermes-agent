# Canonical North Caledonia production policy overlay.
# This is deployment policy, not the Hermes upstream software default.
kanban:
  gauntlet_enforcement: true

platforms:
  api_server:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8085

environment:
  API_SERVER_HOST: 127.0.0.1
  API_SERVER_PORT: 8085
